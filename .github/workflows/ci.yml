name: Specte-rs CI

on:
  push:
    branches: [ main, mvp ]
  pull_request:
    branches: [ main, mvp ]

env:
  CARGO_TERM_COLOR: always

jobs:
  code_cleaniness_checks:
    name: Formatting Checks
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust
        uses: hecrj/setup-rust-action@v2
        with:
          rust-version: nightly
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v6
      - run: cargo fmt --check
      - run: cargo clippy --all
  tests:
    needs: code_cleaniness_checks
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust
        uses: hecrj/setup-rust-action@v2
        with:
          rust-version: stable
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/checkout@v6
      - name: Fetch Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: 'latest'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check ghast (native)
        run: cargo check -p ghast --bin ghast-native
      - name: Check ghast (WASM)
        working-directory: ghast
        run: trunk build
      - run: cargo build
      - run: cargo test
  deploy_pages:
    name: Deploy ghast (WASM) to GitHub Pages
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/mvp'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Setup Rust
        uses: hecrj/setup-rust-action@v2
        with:
          rust-version: stable
          targets: wasm32-unknown-unknown
      - uses: actions/checkout@v6
      - name: Fetch Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: 'latest'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build ghast (WASM, release)
        working-directory: ghast
        run: trunk build --release
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ghast/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
