[package]
name = "ghast"
version = "0.1.0"
edition = "2024"

[dependencies]
accesskit = "0.21.1"
bytes = "1.12.1"
derive_more = { workspace = true, features = ["from"] }
futures = "0.3.34"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
serde = { workspace = true, features = ["derive"] }
spirit = { path = "../spirit" }
time = { version = "0.3.36", features = ["local-offset"] }
tokio-stream = "0.1.17"
toml = "1.1.2"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
troupe = { workspace = true }
xilem_core = "0.4.0"
winit = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap = { version = "4.5.21", features = ["derive"] }
accesskit_winit = { version = "0.29.2", default-features = false, features = ["accesskit_unix", "rwh_06", "tokio"] }
masonry = "0.4.0"
masonry_winit = "0.4.0"
tokio = { workspace = true, features = ["full"] }
xilem = "0.4.0"
instant = "0.1"

[target.wasm32-unknown-unknown.dependencies]
base64 = "0.23.1"
tokio = { workspace = true, default-features = false, features = ["sync", "rt", "time", "macros"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }
wasm-bindgen-futures = "0.4.54"
web-sys = { version = "0.3.104", features = ["Window", "Storage", "CanvasRenderingContext2d", "ImageData", "CssStyleDeclaration", "Document", "Element", "EventTarget", "HtmlCanvasElement", "HtmlElement"] }
xilem_web = "0.4.0"
