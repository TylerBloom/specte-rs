[package]
name = "ghast"
version = "0.1.0"
edition = "2024"

[lib]
name = "ghast"
path = "src/lib.rs"

[[bin]]
name = "ghast-native"
path = "src/bin/native.rs"

[[bin]]
name = "ghast-web"
path = "src/bin/web.rs"

[dependencies]
accesskit = "0.21.1"
accesskit_unix = { version = "0.22.1", default-features = false, features = ["tokio"] }
accesskit_winit = { version = "0.29.2", default-features = false, features = ["accesskit_unix", "rwh_06", "tokio"] }
bytes = "1.12.1"
clap = { version = "4.5.21", features = ["derive"] }
homedir = "0.3.4"
itertools = "0.13.0"
masonry = "0.4.0"
masonry_winit = "0.4.0"
png = "0.18.0"
postcard = { version = "1.1.1", features = ["alloc"] }
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
serde = { version = "1.0.219", features = ["derive"] }
spirit = { path = "../spirit" }
time = { version = "0.3.36", features = ["local-offset"] }
tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = "0.1.17"
toml = "1.1.2"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
winit = "0.30.13"
xilem = "0.4.0"
xilem_core = "0.4.0"
